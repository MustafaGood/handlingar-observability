metadata:
  name: allow-exporter-egress-to-datastores
  namespace: observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prometheus-postgres-exporter
          - prometheus-redis-exporter
          - prometheus-memcached-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - handlingar
                  - tst
                  - qat
                  - handlingar-preview
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 11211
---
